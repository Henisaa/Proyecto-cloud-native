spring:
  datasource:
    url: jdbc:h2:mem:catalog_local;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092

app:
  security:
    enabled: false
