spring.application.name=ms-rutaexpress-notify
server.port=${PORT:8082}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${spring.rabbitmq.host}:${spring.rabbitmq.port}}

# Topología RutaExpress: nombres centralizados (los mismos en todos los microservicios)
app.rabbit.exchanges.events=${RABBIT_EXCHANGE_EVENTS:ex.rutaexpress.events}
app.rabbit.exchanges.dead-letter=${RABBIT_EXCHANGE_DLX:ex.rutaexpress.dlx}
app.rabbit.queues.notification.name=q.rutaexpress.notification
app.rabbit.queues.notification.dlq=q.rutaexpress.notification.dlq
app.rabbit.queues.notification.dead-letter-key=notification
app.rabbit.queues.notification.bindings=notification.#
app.rabbit.routing.notification-email=notification.email.send
app.rabbit.routing.notification-ticket=notification.warehouse.ticket
app.rabbit.routing.notification-label=notification.label.generate
app.rabbit.consumer.prefetch=${RABBIT_PREFETCH:10}
app.rabbit.dlq.auto-startup=${RABBIT_DLQ_CONSUMER_ENABLED:true}

# SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# JavaMail no tiene límite por defecto: un SMTP caído dejaba colgado el hilo del consumidor en vez de fallar y reintentar.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Redis para idempotencia
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Notificaciones
rutaexpress.notify.from=${NOTIFY_FROM:no-reply@rutaexpress.local}
rutaexpress.notify.retry.max-attempts=${RABBIT_RETRY_MAX_ATTEMPTS:${NOTIFY_RETRY_MAX_ATTEMPTS:3}}
rutaexpress.notify.retry.initial-interval=${RABBIT_RETRY_INITIAL_MS:${NOTIFY_RETRY_INITIAL_INTERVAL:1000}}
rutaexpress.notify.retry.multiplier=${NOTIFY_RETRY_MULTIPLIER:2.0}
rutaexpress.notify.retry.max-interval=${NOTIFY_RETRY_MAX_INTERVAL:10000}
rutaexpress.notify.idempotency-ttl=${NOTIFY_IDEMPOTENCY_TTL:7d}

# Firebase es opcional; se activa al indicar credentials-path.
rutaexpress.notify.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Azure AD / JWT (desactivar solo en desarrollo local)
rutaexpress.security.enabled=${SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e},${AZURE_AD_CLIENT_ID:f3136620-804c-4b15-b22d-b6fad957937e}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=true
management.health.redis.enabled=true
management.health.mail.enabled=true
management.endpoint.health.show-details=when-authorized
