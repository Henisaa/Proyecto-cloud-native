name: rutaexpress-ci-system
services:
  oidc:
    build:
      context: ../..
      dockerfile: tests/system/Dockerfile.oidc
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    image: nginxinc/nginx-unprivileged:alpine
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [127.0.0.1:8088:8080]
  frontend-e2e:
    image: rutaexpress-ci/frontend-e2e:test
    environment:
      API_BASE_URL: http://127.0.0.1:8088
      MSAL_CLIENT_ID: ci-only
      MSAL_AUTHORITY: http://oidc:9000
      MSAL_REDIRECT_URI: http://127.0.0.1:8089
      MSAL_SCOPE: api://rutaexpress-ci/access_as_user
      ENVIRONMENT_NAME: ci
    ports: [127.0.0.1:8089:8080]
networks:
  default:
    external: true
    name: rutaexpress
