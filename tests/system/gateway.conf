server {
    listen 8080;
    server_name _;
    add_header Access-Control-Allow-Origin 'http://127.0.0.1:8089' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    location = /health { return 200 'OK'; }
    location = /_validate {
        internal;
        proxy_pass http://oidc:9000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header Authorization $http_authorization;
    }
    location /fixture/ { proxy_pass http://oidc:9000/; }
    location /api/admin/ {
        if ($request_method = OPTIONS) { return 204; }
        auth_request /_validate;
        proxy_pass http://bff:8080/api/bff/admin/;
    }
    location /api/bff/ {
        if ($request_method = OPTIONS) { return 204; }
        auth_request /_validate;
        proxy_pass http://bff:8080/api/bff/;
    }
}
