# Nodo 1 del clúster dentro del contenedor (AMQP 5672, Management 15672, distribución Erlang 25672).
listeners.tcp.default = 5672
management.tcp.port = 15672
# nginx publica el Management UI en /rabbitmq/ (la API queda en /rabbitmq/api).
management.path_prefix = /rabbitmq
prometheus.tcp.port = 15692

# El nodo 1 arranca primero y forma el clúster; el nodo 2 (rabbit2.conf) se une a él. Si aquí figurara también
# rabbit2, el nodo 1 esperaría ~90 s a un nodo que todavía no arranca antes de seguir solo.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit1@localhost
cluster_partition_handling = autoheal
queue_leader_locator = balanced

# Tope absoluto: el contenedor lo comparten los dos nodos y cinco JVM.
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 200MB

log.console = true
log.console.level = warning
log.file = false
