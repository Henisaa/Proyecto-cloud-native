; Procesos de la imagen todo en uno. supervisord los arranca por prioridad y los reinicia si se caen.
; Todos escriben en la salida estándar del contenedor (los logs de Render). Estado: supervisorctl -c <este archivo> status
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------- Infraestructura
[program:rabbit1]
command=bash /opt/rutaexpress/run-rabbit.sh 1
user=rabbitmq
environment=HOME="/var/lib/rabbitmq"
priority=10
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbit2]
command=bash /opt/rutaexpress/run-rabbit.sh 2
user=rabbitmq
environment=HOME="/var/lib/rabbitmq"
priority=11
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:rabbit-init]
command=bash /opt/rutaexpress/rabbit-init.sh
user=rabbitmq
environment=HOME="/var/lib/rabbitmq"
priority=12
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 64mb --maxmemory-policy noeviction --logfile ""
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mailpit]
command=/usr/local/bin/mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025 --webroot /mailpit/
user=nobody
environment=HOME="/tmp"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

