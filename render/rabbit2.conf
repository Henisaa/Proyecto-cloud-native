# Nodo 2 del clúster dentro del contenedor (AMQP 5673, Management 15673, distribución Erlang 25673).
listeners.tcp.default = 5673
management.tcp.port = 15673
management.path_prefix = /rabbitmq
prometheus.tcp.port = 15693

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit1@localhost
cluster_formation.classic_config.nodes.2 = rabbit2@localhost
cluster_partition_handling = autoheal
queue_leader_locator = balanced

vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 200MB

log.console = true
log.console.level = warning
log.file = false
