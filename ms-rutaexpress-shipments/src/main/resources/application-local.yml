spring:
  datasource:
    url: jdbc:h2:mem:shipments_local;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  method-security:
    enabled: ${SECURITY_ENABLED:false}
  security:
    enabled: ${SECURITY_ENABLED:false}
  kafka:
    enabled: false
  # RabbitMQ queda activo también en local (requiere el clúster de infra/mq). Catálogo se integra con CATALOGO_ENABLED=true.
  catalogo:
    enabled: ${CATALOGO_ENABLED:false}
