server:
  port: ${PORT:8085}

spring:
  application:
    name: ms-rutaexpress-shipments

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}}
    username: ${SPRING_DATASOURCE_USERNAME:ruta_shipments}
    password: ${SPRING_DATASOURCE_PASSWORD:Ruta1234}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    publisher-confirm-type: correlated
    publisher-returns: true
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
    azure:
      audience: ${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      shipments-events: ${KAFKA_TOPIC_SHIPMENTS_EVENTS:shipments.events}
      envios-events: ${KAFKA_TOPIC_AUDIT_TIMELINE:audit.timeline}
  # Topología RabbitMQ compartida por todos los microservicios (nombres centralizados)
  rabbit:
    enabled: ${RABBIT_ENABLED:true}
    exchanges:
      command: ${RABBIT_EXCHANGE_COMMAND:ex.rutaexpress.cmd}
      events: ${RABBIT_EXCHANGE_EVENTS:ex.rutaexpress.events}
      dead-letter: ${RABBIT_EXCHANGE_DLX:ex.rutaexpress.dlx}
    queues:
      audit:
        name: q.rutaexpress.audit
        dlq: q.rutaexpress.audit.dlq
        dead-letter-key: audit
        bindings:
          - "shipment.#"
          - "catalog.#"
    routing:
      capacity-reserve: capacity.reserve
      capacity-release: capacity.release
      capacity-reserved: catalog.capacity.reserved
      capacity-rejected: catalog.capacity.rejected
      capacity-released: catalog.capacity.released
      capacity-result-prefix: "catalog.capacity."
      shipment-status-prefix: "shipment.status."
      notification-email: notification.email.send
      notification-ticket: notification.warehouse.ticket
      notification-label: notification.label.generate
    consumer:
      prefetch: ${RABBIT_PREFETCH:10}
      max-attempts: ${RABBIT_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${RABBIT_RETRY_INITIAL_MS:500}
    dlq:
      auto-startup: ${RABBIT_DLQ_CONSUMER_ENABLED:true}
  catalogo:
    enabled: ${CATALOGO_ENABLED:true}
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  notify:
    warehouse-email: ${NOTIFY_WAREHOUSE_EMAIL:bodega@rutaexpress.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.rutaexpress.shipments: INFO
