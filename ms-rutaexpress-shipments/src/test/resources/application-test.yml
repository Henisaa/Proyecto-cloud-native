spring:
  datasource:
    url: jdbc:h2:mem:shipments_test;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    enabled: false
  kafka:
    enabled: false
  rabbit:
    enabled: false
  catalogo:
    enabled: false
