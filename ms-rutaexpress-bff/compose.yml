services:
  ms-rutaexpress-bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-bff
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AZURE_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      RUTAEXPRESS_SECURITY_AUDIENCE: ${AZURE_AUDIENCE:-api://rutaexpress-api}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://ms-rutaexpress-catalog:8081}
      NOTIFY_SERVICE_URL: ${NOTIFY_SERVICE_URL:-http://ms-rutaexpress-notify:8082}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://ms-rutaexpress-audit:8083}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://ms-rutaexpress-report:8084}
    restart: unless-stopped
