services:
  ms-rutaexpress-bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-rutaexpress-bff
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${AZURE_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}
      RUTAEXPRESS_SECURITY_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-bc307149-9a0a-45b8-9f7d-2dfc104f9a09}
      RUTAEXPRESS_SECURITY_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-f3136620-804c-4b15-b22d-b6fad957937e}
      RUTAEXPRESS_SECURITY_AUDIENCE: ${AZURE_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://ms-rutaexpress-catalog:8081}
      NOTIFY_SERVICE_URL: ${NOTIFY_SERVICE_URL:-http://ms-rutaexpress-notify:8082}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://ms-rutaexpress-audit:8083}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://ms-rutaexpress-report:8084}
    restart: unless-stopped
