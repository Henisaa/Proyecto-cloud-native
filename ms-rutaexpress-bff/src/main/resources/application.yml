server:
  port: 8080

spring:
  application:
    name: ms-rutaexpress-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}

  cache:
    type: caffeine
    cache-names:
      - dashboard
      - catalog-services
    caffeine:
      spec: maximumSize=200,expireAfterWrite=60s

rutaexpress:
  security:
    azure-tenant-id: ${AZURE_TENANT_ID:common}
    azure-client-id: ${AZURE_CLIENT_ID:api://rutaexpress-api}
    audience: ${AZURE_AUDIENCE:api://rutaexpress-api}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    notify-url: ${NOTIFY_SERVICE_URL:http://localhost:8082}
    audit-url: ${AUDIT_SERVICE_URL:http://localhost:8083}
    report-url: ${REPORT_SERVICE_URL:http://localhost:8084}
    shipments-url: ${SHIPMENTS_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
