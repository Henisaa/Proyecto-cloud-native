server:
  port: ${PORT:8080}

spring:
  application:
    name: ms-rutaexpress-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}

  cache:
    type: caffeine
    cache-names:
      - dashboard
      - catalog-services
    caffeine:
      spec: maximumSize=200,expireAfterWrite=60s

rutaexpress:
  security:
    azure-tenant-id: ${AZURE_TENANT_ID:bc307149-9a0a-45b8-9f7d-2dfc104f9a09}
    azure-client-id: ${AZURE_CLIENT_ID:f3136620-804c-4b15-b22d-b6fad957937e}
    audience: ${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e}
    scope: ${AZURE_SCOPE:api://f3136620-804c-4b15-b22d-b6fad957937e/access_as_user}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:8000}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    notify-url: ${NOTIFY_SERVICE_URL:http://localhost:8082}
    audit-url: ${AUDIT_SERVICE_URL:http://localhost:8083}
    report-url: ${REPORT_SERVICE_URL:http://localhost:8084}
    mq-admin-url: ${MQ_ADMIN_SERVICE_URL:http://localhost:8086}
    kafka-admin-url: ${KAFKA_ADMIN_SERVICE_URL:http://localhost:8087}
    shipments-url: ${SHIPMENTS_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  method-security:
    enabled: ${SECURITY_ENABLED:true}
  security:
    enabled: ${SECURITY_ENABLED:true}
