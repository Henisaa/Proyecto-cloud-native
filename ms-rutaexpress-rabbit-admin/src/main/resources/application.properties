spring.application.name=ms-rutaexpress-rabbit-admin
server.port=${PORT:8086}
app.security.enabled=${SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e},${AZURE_AD_CLIENT_ID:f3136620-804c-4b15-b22d-b6fad957937e}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Clúster RabbitMQ (rabbit1 y rabbit2). Publicación confirmada y mandatory para detectar mensajes no enrutados.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rutaexpress}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rutaexpress-local}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Nombres centralizados de la topología RutaExpress (exchanges, colas, DLQ y enlaces).
app.rabbit.exchanges.command=${RABBIT_EXCHANGE_COMMAND:ex.rutaexpress.cmd}
app.rabbit.exchanges.events=${RABBIT_EXCHANGE_EVENTS:ex.rutaexpress.events}
app.rabbit.exchanges.dead-letter=${RABBIT_EXCHANGE_DLX:ex.rutaexpress.dlx}
app.rabbit.queues.command.name=q.rutaexpress.command
app.rabbit.queues.command.dlq=q.rutaexpress.command.dlq
app.rabbit.queues.command.dead-letter-key=command
app.rabbit.queues.command.bindings=capacity.reserve,capacity.release
app.rabbit.queues.notification.name=q.rutaexpress.notification
app.rabbit.queues.notification.dlq=q.rutaexpress.notification.dlq
app.rabbit.queues.notification.dead-letter-key=notification
app.rabbit.queues.notification.bindings=notification.#
app.rabbit.queues.audit.name=q.rutaexpress.audit
app.rabbit.queues.audit.dlq=q.rutaexpress.audit.dlq
app.rabbit.queues.audit.dead-letter-key=audit
app.rabbit.queues.audit.bindings=shipment.#,catalog.#

# Gestión HTTP de RabbitMQ: se prueban en orden y el primero que responda atiende la consulta.
app.mq.management-urls=${RABBITMQ_MANAGEMENT_URLS:http://localhost:15672,http://localhost:15673}
app.mq.command-ttl-ms=${MQ_COMMAND_TTL_MS:86400000}
app.mq.dlq-ttl-ms=${MQ_DLQ_TTL_MS:604800000}
app.mq.max-length=${MQ_MAX_LENGTH:10000}
app.mq.alert-threshold=${MQ_ALERT_THRESHOLD:1}
app.mq.poll-interval-ms=${MQ_POLL_INTERVAL_MS:30000}
