server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: ms-rutaexpress-catalog

  # Perfil activo por defecto (prod con Oracle, o local/test)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Base de Datos Oracle por defecto para despliegue Cloud / EC2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}}
    username: ${SPRING_DATASOURCE_USERNAME:c##rutaexpress}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Seguridad IDaaS Azure AD
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:bc307149-9a0a-45b8-9f7d-2dfc104f9a09}/v2.0}

  # RabbitMQ: clúster rabbit1/rabbit2 (comandos de capacidad y resultados)
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # Kafka Event Streaming
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false

# Configuración personalizada de la aplicación RutaExpress
app:
  # @PreAuthorize sigue el mismo interruptor que el filtro JWT (igual que BFF y shipments).
  method-security:
    enabled: ${SECURITY_ENABLED:true}
  security:
    enabled: ${SECURITY_ENABLED:true}
    azure:
      audience: ${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      catalog-events: ${KAFKA_TOPIC_CATALOG_EVENTS:catalog.events}

# Topología RabbitMQ compartida por todos los microservicios (nombres centralizados)
app.rabbit:
  enabled: ${RABBIT_ENABLED:true}
  exchanges:
    command: ${RABBIT_EXCHANGE_COMMAND:ex.rutaexpress.cmd}
    events: ${RABBIT_EXCHANGE_EVENTS:ex.rutaexpress.events}
    dead-letter: ${RABBIT_EXCHANGE_DLX:ex.rutaexpress.dlx}
  queues:
    command:
      name: q.rutaexpress.command
      dlq: q.rutaexpress.command.dlq
      dead-letter-key: command
      bindings:
        - capacity.reserve
        - capacity.release
  routing:
    capacity-reserve: capacity.reserve
    capacity-release: capacity.release
    capacity-reserved: catalog.capacity.reserved
    capacity-rejected: catalog.capacity.rejected
    capacity-released: catalog.capacity.released
  consumer:
    prefetch: ${RABBIT_PREFETCH:10}
    max-attempts: ${RABBIT_RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RABBIT_RETRY_INITIAL_MS:500}
  dlq:
    auto-startup: ${RABBIT_DLQ_CONSUMER_ENABLED:true}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true

# Actuator & Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.rutaexpress.catalog: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
