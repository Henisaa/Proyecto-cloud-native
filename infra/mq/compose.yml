# Clúster RabbitMQ de dos nodos (rabbit1 y rabbit2). Requiere la red externa "rutaexpress" y el secreto de la cookie:
#   docker network create rutaexpress
#   ./infra/scripts/init-secrets.sh
# El Management UI queda en 127.0.0.1: se abre con un túnel SSH. Los puertos AMQP no se publican (red interna).
name: rutaexpress-mq

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-rabbit: &rabbit
  image: rabbitmq:4-management
  restart: unless-stopped
  logging: *logging
  mem_limit: 768m
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?defina RABBITMQ_USERNAME en infra/.env}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD en infra/.env}
  # La cookie de Erlang llega como secreto (archivo), no como variable de entorno: se copia con los permisos
  # que exige Erlang (600, dueño rabbitmq) antes de iniciar el servidor.
  secrets:
    - erlang_cookie
  entrypoint: [bash, /opt/rutaexpress/start-rabbit.sh]
  healthcheck:
    test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl authenticate_user \"$$RABBITMQ_DEFAULT_USER\" \"$$RABBITMQ_DEFAULT_PASS\" >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 30s

services:
  rabbit1:
    <<: *rabbit
    hostname: rabbit1
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./start-rabbit.sh:/opt/rutaexpress/start-rabbit.sh:ro

  rabbit2:
    <<: *rabbit
    hostname: rabbit2
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbit2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./start-rabbit.sh:/opt/rutaexpress/start-rabbit.sh:ro
    depends_on:
      rabbit1:
        condition: service_healthy

secrets:
  erlang_cookie:
    file: ../secrets/erlang.cookie

volumes:
  rabbit1:
  rabbit2:

networks:
  default:
    external: true
    name: rutaexpress
