{
  "services": {
    "rabbitmq-1": {
      "image": "rabbitmq:4-management",
      "hostname": "rabbitmq-1",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "RABBITMQ_ERLANG_COOKIE": "${RABBITMQ_ERLANG_COOKIE:-rutaexpress-local-cookie}"
      },
      "ports": [
        "127.0.0.1:5672:5672",
        "127.0.0.1:15672:15672"
      ],
      "volumes": [
        "rabbitmq-1:/var/lib/rabbitmq",
        "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 20
      }
    },
    "rabbitmq-2": {
      "image": "rabbitmq:4-management",
      "hostname": "rabbitmq-2",
      "environment": {
        "RABBITMQ_DEFAULT_USER": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "RABBITMQ_ERLANG_COOKIE": "${RABBITMQ_ERLANG_COOKIE:-rutaexpress-local-cookie}"
      },
      "ports": [
        "127.0.0.1:5673:5672",
        "127.0.0.1:15673:15672"
      ],
      "volumes": [
        "rabbitmq-2:/var/lib/rabbitmq",
        "./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 20
      },
      "depends_on": {
        "rabbitmq-1": {
          "condition": "service_healthy"
        }
      }
    }
  },
  "volumes": {
    "rabbitmq-1": null,
    "rabbitmq-2": null
  },
  "networks": {
    "default": {
      "external": true,
      "name": "rutaexpress"
    }
  }
}
