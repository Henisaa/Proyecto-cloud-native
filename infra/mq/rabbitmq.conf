# Clúster de dos nodos: rabbit1 y rabbit2 con descubrimiento clásico por nombre de nodo.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Con dos nodos, pause_minority dejaría sin servicio al nodo superviviente cuando el otro cae
# (no alcanza la mayoría). autoheal conserva el nodo que sigue activo y reintegra al que vuelve.
cluster_partition_handling = autoheal

# Reparte los líderes de las colas entre ambos nodos (las colas clásicas viven en un solo nodo).
queue_leader_locator = balanced

# Marca de memoria relativa al límite del contenedor (768 MB): evita que la alarma bloquee a los productores
# antes de tiempo, y que el contenedor muera por falta de memoria antes de que RabbitMQ aplique el freno.
vm_memory_high_watermark.relative = 0.5
disk_free_limit.absolute = 200MB

# Vhost y políticas de retención desde el primer arranque: Policies muestra rutaexpress.trabajo y rutaexpress.dlq
# sin llamar a ningún endpoint. El administrador las vuelve a aplicar de forma idempotente.
load_definitions = /etc/rabbitmq/definitions.json
