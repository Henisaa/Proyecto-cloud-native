# Kafka de la EP1: 3 ZooKeeper, 3 brokers y kafka-ui. Se enciende solo si el EC2 tiene memoria suficiente (ver infra/README.md).
# El heap de cada proceso queda por debajo del límite del contenedor; si no, Docker lo mata por falta de memoria.
name: rutaexpress-kafka

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-zookeeper: &zookeeper
  image: zookeeper:3.9
  restart: unless-stopped
  logging: *logging
  mem_limit: 384m
  healthcheck:
    test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 30

x-kafka: &kafka
  image: apache/kafka:3.9.2
  restart: unless-stopped
  logging: *logging
  mem_limit: 768m
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 25
    start_period: 60s
  command: ["bash", "/opt/rutaexpress/start-zookeeper-mode.sh"]

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

x-zk-servers: &zk-servers "server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181"

services:
  zookeeper-1:
    <<: *zookeeper
    hostname: zookeeper-1
    environment:
      ZOO_MY_ID: "1"
      ZOO_SERVERS: *zk-servers
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      ZK_SERVER_HEAP: "256"
    volumes: [zookeeper-1:/data, zookeeper-1-log:/datalog]

  zookeeper-2:
    <<: *zookeeper
    hostname: zookeeper-2
    environment:
      ZOO_MY_ID: "2"
      ZOO_SERVERS: *zk-servers
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      ZK_SERVER_HEAP: "256"
    volumes: [zookeeper-2:/data, zookeeper-2-log:/datalog]

  zookeeper-3:
    <<: *zookeeper
    hostname: zookeeper-3
    environment:
      ZOO_MY_ID: "3"
      ZOO_SERVERS: *zk-servers
      ZOO_4LW_COMMANDS_WHITELIST: ruok
      ZK_SERVER_HEAP: "256"
    volumes: [zookeeper-3:/data, zookeeper-3-log:/datalog]

  kafka-1:
    <<: *kafka
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka-1:/var/lib/kafka/data
      - ./start-zookeeper-mode.sh:/opt/rutaexpress/start-zookeeper-mode.sh:ro

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka-2:/var/lib/kafka/data
      - ./start-zookeeper-mode.sh:/opt/rutaexpress/start-zookeeper-mode.sh:ro

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka-3:/var/lib/kafka/data
      - ./start-zookeeper-mode.sh:/opt/rutaexpress/start-zookeeper-mode.sh:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rutaexpress
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on: [kafka-1, kafka-2, kafka-3]

volumes:
  zookeeper-1:
  zookeeper-1-log:
  zookeeper-2:
  zookeeper-2-log:
  zookeeper-3:
  zookeeper-3-log:
  kafka-1:
  kafka-2:
  kafka-3:

networks:
  default:
    external: true
    name: rutaexpress
