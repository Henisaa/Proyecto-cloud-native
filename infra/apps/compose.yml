{
  "services": {
    "bff": {
      "build": {
        "context": "../../ms-rutaexpress-bff"
      },
      "environment": {
        "PORT": "8080",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "CATALOG_SERVICE_URL": "http://catalog:8081",
        "NOTIFY_SERVICE_URL": "http://notify:8082",
        "AUDIT_SERVICE_URL": "http://audit:8083",
        "REPORT_SERVICE_URL": "http://report:8084",
        "SHIPMENTS_SERVICE_URL": "http://shipments:8085",
        "MQ_ADMIN_SERVICE_URL": "http://mq-admin:8086",
        "KAFKA_ADMIN_SERVICE_URL": "http://kafka-admin:8087"
      },
      "ports": [
        "127.0.0.1:8080:8080"
      ]
    },
    "catalog": {
      "build": {
        "context": "../../ms-rutaexpress-catalog"
      },
      "environment": {
        "PORT": "8081",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "SPRING_PROFILES_ACTIVE": "${SPRING_PROFILES_ACTIVE:-local}",
        "SPRING_DATASOURCE_URL": "jdbc:oracle:thin:@//oracle:1521/FREEPDB1",
        "SPRING_DATASOURCE_USERNAME": "ruta_catalog",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:-Rutaexpress123}",
        "KAFKA_ENABLED": "true",
        "RABBIT_ENABLED": "true",
        "CATALOGO_ENABLED": "true",
        "APP_SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "APP_KAFKA_ENABLED": "true",
        "SPRING_KAFKA_ENABLED": "true"
      },
      "ports": [
        "127.0.0.1:8081:8081"
      ]
    },
    "notify": {
      "build": {
        "context": "../../ms-rutaexpress-notify"
      },
      "environment": {
        "PORT": "8082",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "REDIS_HOST": "redis",
        "MAIL_HOST": "mailpit",
        "MAIL_PORT": "1025"
      },
      "ports": [
        "127.0.0.1:8082:8082"
      ],
      "depends_on": {
        "redis": {
          "condition": "service_healthy"
        },
        "mailpit": {
          "condition": "service_started"
        }
      }
    },
    "audit": {
      "build": {
        "context": "../../ms-rutaexpress-audit"
      },
      "environment": {
        "PORT": "8083",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "SPRING_PROFILES_ACTIVE": "${SPRING_PROFILES_ACTIVE:-local}",
        "SPRING_DATASOURCE_URL": "jdbc:oracle:thin:@//oracle:1521/FREEPDB1",
        "SPRING_DATASOURCE_USERNAME": "ruta_audit",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:-Rutaexpress123}",
        "KAFKA_ENABLED": "true",
        "RABBIT_ENABLED": "true",
        "CATALOGO_ENABLED": "true",
        "APP_SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "APP_KAFKA_ENABLED": "true",
        "SPRING_KAFKA_ENABLED": "true"
      },
      "ports": [
        "127.0.0.1:8083:8083"
      ]
    },
    "report": {
      "build": {
        "context": "../../ms-rutaexpress-report"
      },
      "environment": {
        "PORT": "8084",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "SPRING_PROFILES_ACTIVE": "${SPRING_PROFILES_ACTIVE:-local}",
        "SPRING_DATASOURCE_URL": "jdbc:oracle:thin:@//oracle:1521/FREEPDB1",
        "SPRING_DATASOURCE_USERNAME": "ruta_report",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:-Rutaexpress123}",
        "KAFKA_ENABLED": "true",
        "RABBIT_ENABLED": "true",
        "CATALOGO_ENABLED": "true",
        "APP_SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "APP_KAFKA_ENABLED": "true",
        "SPRING_KAFKA_ENABLED": "true"
      },
      "ports": [
        "127.0.0.1:8084:8084"
      ]
    },
    "shipments": {
      "build": {
        "context": "../../ms-rutaexpress-shipments"
      },
      "environment": {
        "PORT": "8085",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "SPRING_PROFILES_ACTIVE": "${SPRING_PROFILES_ACTIVE:-local}",
        "SPRING_DATASOURCE_URL": "jdbc:oracle:thin:@//oracle:1521/FREEPDB1",
        "SPRING_DATASOURCE_USERNAME": "ruta_shipments",
        "SPRING_DATASOURCE_PASSWORD": "${DB_PASSWORD:-Rutaexpress123}",
        "KAFKA_ENABLED": "true",
        "RABBIT_ENABLED": "true",
        "CATALOGO_ENABLED": "true",
        "APP_SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "APP_KAFKA_ENABLED": "true",
        "SPRING_KAFKA_ENABLED": "true",
        "CATALOG_SERVICE_URL": "http://catalog:8081"
      },
      "ports": [
        "127.0.0.1:8085:8085"
      ]
    },
    "mq-admin": {
      "build": {
        "context": "../../ms-rutaexpress-mq-admin"
      },
      "environment": {
        "PORT": "8086",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}",
        "RABBITMQ_MANAGEMENT_URL": "http://rabbitmq-1:15672"
      },
      "ports": [
        "127.0.0.1:8086:8086"
      ]
    },
    "kafka-admin": {
      "build": {
        "context": "../../ms-rutaexpress-kafka-admin"
      },
      "environment": {
        "PORT": "8087",
        "SECURITY_ENABLED": "${SECURITY_ENABLED:-true}",
        "AZURE_AD_ISSUER_URI": "${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}",
        "AZURE_AD_AUDIENCE": "${AZURE_AD_AUDIENCE:-api://f3136620-804c-4b15-b22d-b6fad957937e}",
        "KAFKA_BOOTSTRAP_SERVERS": "kafka-1:29092,kafka-2:29092,kafka-3:29092",
        "RABBITMQ_HOST": "rabbitmq-1",
        "RABBITMQ_ADDRESSES": "rabbitmq-1:5672,rabbitmq-2:5672",
        "RABBITMQ_USERNAME": "${RABBITMQ_USERNAME:-rutaexpress}",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD:-rutaexpress-local}"
      },
      "ports": [
        "127.0.0.1:8087:8087"
      ]
    },
    "redis": {
      "image": "redis:8-alpine",
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ],
      "ports": [
        "127.0.0.1:6379:6379"
      ],
      "volumes": [
        "redis:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20
      }
    },
    "mailpit": {
      "image": "axllent/mailpit:v1.27",
      "ports": [
        "127.0.0.1:8025:8025",
        "127.0.0.1:1025:1025"
      ]
    },
    "oracle": {
      "image": "gvenzl/oracle-free:23-slim",
      "profiles": [
        "oracle"
      ],
      "environment": {
        "ORACLE_PASSWORD": "${DB_PASSWORD:-Rutaexpress123}"
      },
      "ports": [
        "127.0.0.1:1521:1521"
      ],
      "volumes": [
        "oracle:/opt/oracle/oradata",
        "./oracle-init.sql:/container-entrypoint-initdb.d/001-users.sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "healthcheck.sh"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 60
      }
    }
  },
  "volumes": {
    "redis": null,
    "oracle": null
  },
  "networks": {
    "default": {
      "external": true,
      "name": "rutaexpress"
    }
  }
}
