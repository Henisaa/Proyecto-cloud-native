server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /tmp/rutaexpress-headers.conf;
    location = /index.html { add_header Cache-Control 'no-store'; include /tmp/rutaexpress-headers.conf; }
    location ~* "-[a-z0-9_-]{8,}\.(js|css|woff2)$" { expires 1y; add_header Cache-Control 'public, immutable'; include /tmp/rutaexpress-headers.conf; }
    location = /health { access_log off; return 200 'OK'; }
    location = /config.json { add_header Cache-Control 'no-store'; include /tmp/rutaexpress-headers.conf; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
