server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Refresh Docker DNS after the BFF container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    location = /health { access_log off; default_type text/plain; return 200 'OK'; }
    location = /config.js { add_header Cache-Control no-store; }
    location = /index.html { add_header Cache-Control no-store; }
    location /api/ {
        set $bff_origin http://bff:8080;
        proxy_pass $bff_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
