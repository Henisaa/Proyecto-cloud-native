spring.application.name=ms-rutaexpress-kafka-admin
server.port=${PORT:8087}
app.security.enabled=${SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e},${AZURE_AD_CLIENT_ID:f3136620-804c-4b15-b22d-b6fad957937e}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.admin.auto-create=false
app.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:3}
app.kafka.timeout-seconds=${KAFKA_ADMIN_TIMEOUT_SECONDS:10}

# Configuracion del tutorial Kafka: Producer (Tuning alto rendimiento) y Consumer (ErrorHandlingDeserializer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.properties.partitioner.class=com.rutaexpress.kafkaadmin.TutorialPartitioner
spring.kafka.producer.properties.interceptor.classes=com.rutaexpress.kafkaadmin.CorrelationIdProducerInterceptor

spring.kafka.consumer.group-id=mi-grupo-educativo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-N/A}] %logger{36} - %msg%n
