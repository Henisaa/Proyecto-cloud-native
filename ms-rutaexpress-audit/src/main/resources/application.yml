server:
  port: 8083

spring:
  application:
    name: ms-rutaexpress-audit

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:SYSTEM}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      enable-auto-commit: false
      group-id: ms-rutaexpress-audit-group
      auto-offset-reset: earliest
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
      isolation-level: read_committed
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        batch.size: 32768
        linger.ms: 20
        compression.type: snappy
        buffer.memory: 67108864

  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${AZURE_AD_AUDIENCE:api://f3136620-804c-4b15-b22d-b6fad957937e},${AZURE_AD_CLIENT_ID:f3136620-804c-4b15-b22d-b6fad957937e}
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/bc307149-9a0a-45b8-9f7d-2dfc104f9a09/v2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  kafka:
    replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    topics:
      auto-create: ${KAFKA_TOPICS_AUTO_CREATE:true}
      dlt-partitions: ${KAFKA_DLT_PARTITIONS:3}
      dlt-retention-ms: ${KAFKA_DLT_RETENTION_MS:1209600000}
      dlt-cleanup-policy: ${KAFKA_DLT_CLEANUP_POLICY:delete}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-N/A}] %logger{36} - %msg%n"
